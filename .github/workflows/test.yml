name: Tests

permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # pyproject declares support from 3.8, but only 3.13 was ever run, so
        # a 3.8-only failure sat in main unnoticed: asyncio.Semaphore bound to
        # the current event loop before 3.10, which broke client construction
        # for any caller that had already used asyncio.run(). Test the floor
        # and the ceiling of what is claimed, plus a middle version.
        python-version: ["3.8", "3.11", "3.13"]
        exclude:
          # 3.8 has no macOS arm64 build on GitHub's runners.
          - os: macos-latest
            python-version: "3.8"

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-asyncio
        pip install -e . || pip install .

    - name: Run tests
      run: |
        pytest tests/ -v --tb=short

    - name: Upload coverage
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        fail_ci_if_error: false